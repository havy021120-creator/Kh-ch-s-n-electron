          </div>
          <div class="orbital-group">
           <span data-template-id="room-3d-label" class="canva-text orbital-name"></span>
           <div class="room-row">
            <button class="orbital" type="button" data-orbital="3d-1" aria-label="Ô orbital 3d số 1"></button><button class="orbital" type="button" data-orbital="3d-2" aria-label="Ô orbital 3d số 2"></button><button class="orbital" type="button" data-orbital="3d-3" aria-label="Ô orbital 3d số 3"></button><button class="orbital" type="button" data-orbital="3d-4" aria-label="Ô orbital 3d số 4"></button><button class="orbital" type="button" data-orbital="3d-5" aria-label="Ô orbital 3d số 5"></button>
           </div>
          </div>
         </div>
        </section>
        <section class="floor" aria-label="Tầng 4">
         <div data-template-id="floor-four-label" class="canva-text floor-label"></div>
         <div class="floor-rooms">
          <div class="orbital-group">
           <span data-template-id="room-4s-label" class="canva-text orbital-name"></span>
           <div class="room-row">
            <button class="orbital" type="button" data-orbital="4s-1" aria-label="Ô orbital 4s"></button>
           </div>
          </div><span data-template-id="room-4p-label" class="canva-text label-only"></span> <span data-template-id="room-4d-label" class="canva-text label-only"></span> <span data-template-id="room-4f-label" class="canva-text label-only"></span>
         </div>
        </section>
        <div id="feedback-panel" class="feedback-panel" aria-live="polite">
         <p id="feedback-title" class="feedback-title">Chọn một nguyên tố để bắt đầu.</p>
         <p id="feedback-copy" class="feedback-copy">Kéo electron từ sảnh chờ vào các phòng orbital.</p>
        </div>
       </div>
      </section>
     </section>
     <section class="leaderboard-card" aria-labelledby="leaderboard-heading">
      <div data-template-id="leaderboard-banner" class="canva-banner leaderboard-header">
       <div>
        <h2 data-template-id="leaderboard-heading" class="canva-text"></h2>
        <p data-template-id="leaderboard-helper" class="canva-text m-0 text-xs"></p>
       </div><i data-lucide="trophy" class="w-6 h-6" aria-hidden="true"></i>
      </div>
      <div id="leaderboard-list" class="leaderboard-list">
       <p data-template-id="leaderboard-empty" class="canva-text empty-rank"></p>
      </div>
      <form id="clear-form" class="admin-zone">
       <div><label data-template-id="admin-label" class="canva-text field-label mb-1" for="admin-code"></label> <input id="admin-code" class="input-control" type="text" autocomplete="off">
       </div><button id="clear-button" data-template-id="clear-button" class="canva-button small-button" type="submit"></button> <span id="admin-message" class="text-xs font-semibold text-[#6c9296]" aria-live="polite"></span>
      </form>
     </section>
    </main>
   </div>
  </div>
  <script>
    const elements = {
      N:{z:7,configuration:"1s² 2s² 2p³"}, O:{z:8,configuration:"1s² 2s² 2p⁴"},
      Na:{z:11,configuration:"1s² 2s² 2p⁶ 3s¹"}, Mg:{z:12,configuration:"1s² 2s² 2p⁶ 3s²"},
      Al:{z:13,configuration:"1s² 2s² 2p⁶ 3s² 3p¹"}, P:{z:15,configuration:"1s² 2s² 2p⁶ 3s² 3p³"},
      S:{z:16,configuration:"1s² 2s² 2p⁶ 3s² 3p⁴"}, Cl:{z:17,configuration:"1s² 2s² 2p⁶ 3s² 3p⁵"},
      Mn:{z:25,configuration:"1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d⁵"}, Fe:{z:26,configuration:"1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3p⁶ 4s² 3d⁶"}
    };
    const orbitalOrder=["1s-1","2s-1","2p-1","2p-2","2p-3","3s-1","3p-1","3p-2","3p-3","4s-1","3d-1","3d-2","3d-3","3d-4","3d-5"];
    let selectedElement=null, score=0, startTime=null, timerInterval=null, selectedElectron=null, completed=false, rankings=[];
    const lobby=document.getElementById("electron-lobby"), scoreDisplay=document.getElementById("score-display"), timeDisplay=document.getElementById("time-display");
    const feedbackPanel=document.getElementById("feedback-panel"), feedbackTitle=document.getElementById("feedback-title"), feedbackCopy=document.getElementById("feedback-copy");
    const checkButton=document.getElementById("check-button");

    function formatTime(seconds){return `${String(Math.floor(seconds/60)).padStart(2,"0")}:${String(seconds%60).padStart(2,"0")}`;}
    function elapsedSeconds(){return startTime ? Math.floor((Date.now()-startTime)/1000) : 0;}
    function setFeedback(type,title,copy){feedbackPanel.classList.remove("success","error");if(type)feedbackPanel.classList.add(type);feedbackTitle.textContent=title;feedbackCopy.textContent=copy;}
    function createElectron(id){
      const electron=document.createElement("span");
      electron.className="electron"; electron.draggable=true; electron.dataset.electronId=id; electron.textContent="↑"; electron.setAttribute("aria-label","Electron có thể kéo");
      electron.addEventListener("dragstart",event=>event.dataTransfer.setData("text/plain",id));
      electron.addEventListener("click",()=>{document.querySelectorAll(".electron.selected").forEach(item=>item.classList.remove("selected"));selectedElectron=electron;electron.classList.add("selected");});
      return electron;
    }
    function clearOrbitals(){document.querySelectorAll(".orbital").forEach(orbital=>orbital.replaceChildren());}
    function resetGame(showMessage=true){
      if(!selectedElement)return;
      completed=false; score=0; scoreDisplay.textContent=score; clearOrbitals(); lobby.replaceChildren(); selectedElectron=null;
      for(let i=0;i<selectedElement.z;i++)lobby.appendChild(createElectron(`e-${i+1}`));
      startTime=Date.now(); clearInterval(timerInterval); timerInterval=setInterval(()=>timeDisplay.textContent=formatTime(elapsedSeconds()),1000);
      timeDisplay.textContent="00:00";
      if(showMessage)setFeedback("","Lượt chơi mới đã sẵn sàng!","Hãy xếp electron theo thứ tự 1s → 2s → 2p → 3s → 3p → 4s → 3d.");
    }
    function moveElectronToOrbital(electron,orbital){
      if(!electron||!orbital||completed)return;
      if(orbital.children.length>=2){setFeedback("error","Phòng này đã đầy!","Mỗi ô orbital chỉ chứa tối đa 2 electron quay ngược chiều nhau.");return;}
      if(electron.closest(".orbital")===orbital)return;
      orbital.appendChild(electron);
      orbital.querySelectorAll(".electron").forEach((item,index)=>item.textContent=index===0?"↑":"↓");
      selectedElectron=null; document.querySelectorAll(".electron.selected").forEach(item=>item.classList.remove("selected"));
    }
    function expectedOccupancies(z){
      const occupancies={}; orbitalOrder.forEach(key=>occupancies[key]=0); let remaining=z;
      [["1s-1"],["2s-1"],["2p-1","2p-2","2p-3"],["3s-1"],["3p-1","3p-2","3p-3"],["4s-1"],["3d-1","3d-2","3d-3","3d-4","3d-5"]].forEach(group=>{
        group.forEach(orbital=>{if(remaining>0){occupancies[orbital]++;remaining--;}});
        group.forEach(orbital=>{if(remaining>0){occupancies[orbital]++;remaining--;}});
      }); return occupancies;
    }
    function isCorrectConfiguration(){
      const expected=expectedOccupancies(selectedElement.z);
      return orbitalOrder.every(id=>document.querySelector(`[data-orbital="${id}"]`).children.length===expected[id]);
    }
    function playSuccessSound(){
      const Context=window.AudioContext||window.webkitAudioContext;if(!Context)return;
      const context=new Context();
      [1046.5,1318.5].forEach((frequency,index)=>{const oscillator=context.createOscillator(),gain=context.createGain(),delay=index*.18;oscillator.frequency.value=frequency;gain.gain.setValueAtTime(.001,context.currentTime+delay);gain.gain.exponentialRampToValueAtTime(.14,context.currentTime+delay+.02);gain.gain.exponentialRampToValueAtTime(.001,context.currentTime+delay+.4);oscillator.connect(gain);gain.connect(context.destination);oscillator.start(context.currentTime+delay);oscillator.stop(context.currentTime+delay+.42);});
    }
    async function saveResult(){
      const result=await window.dataSdk.create({team_name:document.getElementById("team-name").value.trim(),score,completion_time:elapsedSeconds(),completed_at:new Date().toISOString()});
      if(!result.isOk)setFeedback("error","Đáp án đúng, nhưng chưa lưu được điểm.","Bạn vẫn hoàn thành chính xác. Hãy thử lại sau ít phút.");
    }
    async function checkAnswer(){
      const teamName=document.getElementById("team-name").value.trim();
      if(!teamName){setFeedback("error","Hãy nhập tên đội trước nhé!","Tên đội sẽ được dùng để ghi vào bảng xếp hạng.");document.getElementById("team-name").focus();return;}
      if(!selectedElement){setFeedback("error","Chưa chọn nguyên tố.","Hãy chọn một nguyên tố từ sảnh chờ để nhận electron.");return;}
      if(completed)return;
      if(document.querySelectorAll(".orbital .electron").length!==selectedElement.z){setFeedback("error","Electron vẫn chưa vào đủ phòng!",`Nguyên tố ${selectedElement.symbol} có ${selectedElement.z} electron. Hãy xếp đủ trước khi kiểm tra.`);return;}
      if(isCorrectConfiguration()){
        completed=true;clearInterval(timerInterval);score+=10;scoreDisplay.textContent=score;playSuccessSound();
        setFeedback("success","Bạn rất xuất sắc! Ting Ting ✨",`Cấu hình đúng của ${selectedElement.symbol}: ${selectedElement.configuration}. Bạn hoàn thành trong ${formatTime(elapsedSeconds())}.`);
        checkButton.disabled=true;await saveResult();
      }else{score-=5;scoreDisplay.textContent=score;setFeedback("error","Chưa chính xác, đội hãy thử lại!","Nhớ điền electron theo thứ tự mức năng lượng và ưu tiên electron độc thân tối đa trong các orbital cùng mức.");}
    }
    function renderLeaderboard(data){
      rankings=[...data].sort((a,b)=>b.score!==a.score?b.score-a.score:a.completion_time-b.completion_time);
      const list=document.getElementById("leaderboard-list");list.replaceChildren();
      if(!rankings.length){const empty=document.createElement("p");empty.className="empty-rank";empty.textContent="Chưa có đội nào hoàn thành. Hãy trở thành đội đầu tiên!";list.appendChild(empty);return;}
      rankings.slice(0,10).forEach((record,index)=>{
        const row=document.createElement("div");row.className="rank-row";
        const rank=document.createElement("span");rank.className="rank-number";rank.textContent=index+1;
        const name=document.createElement("strong");name.textContent=record.team_name;
        const points=document.createElement("span");points.className="font-bold text-[#0d6574]";points.textContent=`${record.score} điểm`;
        const time=document.createElement("span");time.className="text-[#679398]";time.textContent=formatTime(record.completion_time);
        row.append(rank,name,points,time);list.appendChild(row);
      });
    }
    async function clearLeaderboard(event){
      event.preventDefault();
      const code=document.getElementById("admin-code"),message=document.getElementById("admin-message"),button=document.getElementById("clear-button");
      if(code.value!=="anhvy02112005"){message.textContent="Mã xác nhận chưa đúng.";return;}
      if(!rankings.length){message.textContent="Bảng xếp hạng đang trống.";return;}
      button.disabled=true;message.textContent="Đang xoá bảng xếp hạng...";
      let failed=false;for(const record of rankings){const result=await window.dataSdk.delete(record);if(!result.isOk){failed=true;break;}}
      button.disabled=false;code.value="";message.textContent=failed?"Chưa thể xoá toàn bộ bảng. Hãy thử lại.":"Đã xoá bảng xếp hạng.";
    }
    document.querySelectorAll(".element-button").forEach(button=>button.addEventListener("click",()=>{
      document.querySelectorAll(".element-button").forEach(item=>item.classList.remove("active"));button.classList.add("active");
      selectedElement={symbol:button.dataset.element,...elements[button.dataset.element]};checkButton.disabled=false;resetGame();
    }));
    document.querySelectorAll(".orbital").forEach(orbital=>{
      orbital.addEventListener("dragover",event=>{event.preventDefault();orbital.classList.add("drop-hover");});
      orbital.addEventListener("dragleave",()=>orbital.classList.remove("drop-hover"));
      orbital.addEventListener("drop",event=>{event.preventDefault();orbital.classList.remove("drop-hover");moveElectronToOrbital(document.querySelector(`[data-electron-id="${event.dataTransfer.getData("text/plain")}"]`),orbital);});
      orbital.addEventListener("click",()=>{if(selectedElectron)moveElectronToOrbital(selectedElectron,orbital);});
    });
    lobby.addEventListener("dragover",event=>event.preventDefault());
    lobby.addEventListener("drop",event=>{event.preventDefault();const electron=document.querySelector(`[data-electron-id="${event.dataTransfer.getData("text/plain")}"]`);if(electron&&electron.closest(".orbital")){lobby.appendChild(electron);electron.textContent="↑";}});
    lobby.addEventListener("click",event=>{if(selectedElectron&&event.target===lobby){lobby.appendChild(selectedElectron);selectedElectron.textContent="↑";selectedElectron.classList.remove("selected");selectedElectron=null;}});
    document.getElementById("team-form").addEventListener("submit",event=>event.preventDefault());
    checkButton.addEventListener("click",checkAnswer);
    document.getElementById("reset-button").addEventListener("click",()=>{checkButton.disabled=false;resetGame();});
    document.getElementById("clear-form").addEventListener("submit",clearLeaderboard);
    document.addEventListener("DOMContentLoaded",async()=>{
      lucide.createIcons();
      const result=await window.dataSdk.init({onDataChanged(data){renderLeaderboard(data);}});
      if(!result.isOk)setFeedback("error","Không thể kết nối bảng xếp hạng.","Bạn vẫn có thể chơi trò chơi, nhưng kết quả chưa thể lưu lúc này.");
    });
  </script>
 </body>
